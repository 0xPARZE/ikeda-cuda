# One long orbit on the classic Ikeda attractor (B = 0.9), for the phase-space
# density map and the fractal-dimension estimate. A single orbit is serial work,
# so the CPU runs it; the GPU only pays off across many B values.
b-min     = 0.9
b-max     = 0.9
n-params  = 1
transient = 1000
record    = 4000000
precision = double
device    = cpu
out       = out/attractor
